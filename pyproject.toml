[project]
name = "ai-chain-radar"
version = "0.1.0"
description = "AI industry chain radar MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "fastapi>=0.111.0",
  "jinja2>=3.1.4",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.4",
  "pyyaml>=6.0.2",
  "tushare>=1.4.20",
  "typer>=0.12.3",
  "uvicorn>=0.30.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.10.0",
  "pytest>=8.2.2",
  "ruff>=0.5.0",
]

[project.scripts]
ai-chain = "ai_chain_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: integration tests that may access real external APIs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
